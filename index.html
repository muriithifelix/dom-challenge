<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping-List</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body
style="background-image: url('https://plus.unsplash.com/premium_photo-1683746792239-6ce8cdd3ac78?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D');
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;" 
             >
    <h1>Shopping List</h1>
    <div id="listContainer">
        <form id="form" onsubmit="return false;">
            <ul id="shoppingList"></ul>
        <input type="text" id="item" placeholder="Add Item"/>
            <input type="number" id="price" placeholder="Price"/>
        </form>
<div id="actionButtons">
        <button class="addBtn">
            Add
        </button>
        <button class="markPurchasedBtn">
            Mark Purchased
        </button>
       <button type="button" class="clearListBtn">
    Clear List
</button>
        </div>
    </div>

<script src="main.js"></script>
</body>
</html>
